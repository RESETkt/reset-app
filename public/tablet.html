<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Reset - check-in</title>
<link rel="icon" href="favicon.png">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #1e1e1d; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding-top: 90px; }
  .card { background: #262624; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.2); color: #ece9e2; }
  input { width: 100%; padding: 10px; border: 1px solid #45443f; border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: #1e1e1d; color: #ece9e2; }
  button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ece9e2; color: #1e1e1d; font-size: 15px; cursor: pointer; font-weight: 500; }
  button.secundar { background: #1e1e1d; border: 1px solid #45443f; color: #ece9e2; margin-top: 8px; }
  h2 { font-size: 24px; text-align: center; margin: 0 0 8px; color: #ece9e2; }
  .sub { font-size: 16px; color: #9a988e; text-align: center; margin-bottom: 16px; }
  .metric { background: #1e1e1d; border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 16px; }
  .metric .label { font-size: 12px; color: #9a988e; }
  .metric .value { font-size: 26px; font-weight: 600; margin-top: 4px; color: #ece9e2; }
  canvas { border: 1px dashed #45443f; border-radius: 8px; width: 100%; height: 140px; touch-action: none; background: #1e1e1d; }
  .gdpr-text { font-size: 12px; color: #9a988e; line-height: 1.5; margin-bottom: 10px; }
  .afisaj-telefon { font-size: 26px; text-align: center; letter-spacing: 3px; padding: 12px; background: #1e1e1d; border-radius: 8px; margin-bottom: 10px; min-height: 24px; border: 1px solid #45443f; }
  .tastatura { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .tastatura button { padding: 24px; font-size: 24px; margin-top: 0; min-width: 0; }
  .tastatura button.principal { background: #2b6cb0; color: #ffffff; font-size: 18px; font-weight: 600; }
  .sugestii { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .sugestie-btn { display: inline-block; width: auto; padding: 16px 22px; background: #1f3634; border: 2px solid #2d5049; border-radius: 12px; font-size: 20px; font-weight: 600; }
  .buton-fullscreen { position: fixed; top: 24px; right: 24px; width: 44px; height: 44px; border-radius: 50%; background: #262624; border: 1px solid #45443f; color: #9a988e; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
</style>
</head>
<body>

<span class="buton-fullscreen" onclick="comutaFullscreen()" title="Ecran complet">&#10021;</span>

<div style="position:fixed;top:24px;left:50%;transform:translateX(-50%)">
  <img src="logo-icon.png" alt="Reset" style="height:64px">
</div>

<div class="card" id="pas-cautare">
  <h2>Hai, ca bine a fi</h2>
  <div class="sub">Introdu numarul de telefon</div>
  <div class="afisaj-telefon" id="afisaj-telefon">&nbsp;</div>
  <div class="sugestii" id="sugestii-telefon"></div>
  <div class="tastatura">
    <button onclick="apasaCifra('1')">1</button>
    <button onclick="apasaCifra('2')">2</button>
    <button onclick="apasaCifra('3')">3</button>
    <button onclick="apasaCifra('4')">4</button>
    <button onclick="apasaCifra('5')">5</button>
    <button onclick="apasaCifra('6')">6</button>
    <button onclick="apasaCifra('7')">7</button>
    <button onclick="apasaCifra('8')">8</button>
    <button onclick="apasaCifra('9')">9</button>
    <button class="secundar" onclick="stergeCifra()">&larr;</button>
    <button onclick="apasaCifra('0')">0</button>
    <button class="principal" onclick="cautaProgramare()">Continua</button>
  </div>
  <div id="eroare-cautare" style="color:#b23b3b;font-size:12px;margin-top:8px;text-align:center"></div>
</div>

<div class="card" id="pas-gdpr" style="display:none">
  <h2>Prima ta vizita</h2>
  <div class="sub">Te rugam sa semnezi consimtamantul GDPR</div>
  <div class="gdpr-text" id="gdpr-text"></div>
  <canvas id="canvas-gdpr"></canvas>
  <button onclick="trimiteGDPR()">Confirma</button>
  <button class="secundar" onclick="stergeCanvas('canvas-gdpr')">Sterge semnatura</button>
</div>

<div class="card" id="pas-confirmare" style="display:none">
  <h2 id="salut-nume"></h2>
  <div class="sub" id="detalii-programare"></div>
  <div class="metric">
    <div class="label">Sedinte ramase din abonament</div>
    <div class="value" id="sedinte-ramase">-</div>
  </div>
  <div class="sub" style="margin-bottom:6px">Apasa pentru a confirma prezenta la sedinta de azi</div>
  <button onclick="trimiteConfirmareSedinta()">Confirma prezenta</button>
</div>

<div class="card" id="pas-gata" style="display:none">
  <h2>Multumim!</h2>
  <div class="sub">Prezenta ta a fost confirmata.</div>
</div>

<script src="tablet.js"></script>
</body>
</html>
