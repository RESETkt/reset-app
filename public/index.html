<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset - dashboard kineto</title>
<link rel="icon" href="favicon-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login" class="card" style="max-width:340px;margin:80px auto;">
  <div style="text-align:center;margin-bottom:16px">
    <img src="logo-icon.png" alt="Reset" style="height:56px">
  </div>
  <h2 style="text-align:center">Autentificare</h2>
  <label>Email</label>
  <input id="login-email" type="email" style="width:100%;margin-bottom:10px" autocomplete="username">
  <label>Parola</label>
  <input id="login-parola" type="password" style="width:100%;margin-bottom:14px" autocomplete="current-password">
  <button class="btn" style="width:100%" onclick="login()">Intra in cont</button>
  <div id="login-eroare" style="color:#b23b3b;font-size:12px;margin-top:8px"></div>
</div>

<div id="app" class="app" style="display:none">
  <div class="mobile-topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <img src="logo-icon.png" alt="Reset" style="height:26px">
      <span style="font-size:16px;font-weight:700;color:#ffffff;letter-spacing:0.5px">RESET</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <svg class="topbar-icon-btn" onclick="aratatFormularPacientNou()" title="Pacient nou" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <svg class="topbar-icon-btn" onclick="delogare()" title="Delogare" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </div>
  </div>

  <div class="sidebar">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px">
        <img src="logo-icon.png" alt="Reset" style="height:32px">
        <span style="font-size:18px;font-weight:700;color:#ffffff;letter-spacing:0.5px">RESET</span>
      </div>
      <svg class="logout-btn" onclick="delogare()" title="Delogare" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">
      <button class="btn top-nav-btn activ" data-panel="calendar" onclick="aratapanel('calendar')">Programari</button>
      <button class="btn top-nav-btn" data-panel="fisa" onclick="aratapanel('fisa')">Fise pacienti</button>
      <button class="btn top-nav-btn" data-panel="echipa" onclick="aratapanel('echipa')">Echipa</button>
      <button class="btn top-nav-btn" data-panel="statistici" onclick="aratapanel('statistici')">Statistici</button>
    </div>
    <button class="btn" style="width:100%;margin-bottom:12px" onclick="aratatFormularPacientNou()">+ Pacient nou</button>
  </div>
  <div class="main">
    <div id="panel-calendar"></div>
    <div id="panel-fisa" style="display:none"></div>
    <div id="panel-echipa" style="display:none"></div>
    <div id="panel-statistici" style="display:none"></div>
  </div>

  <nav class="bottom-nav">
    <button class="bottom-nav-btn activ" data-panel="calendar" onclick="aratapanel('calendar')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span>Programari</span>
    </button>
    <button class="bottom-nav-btn" data-panel="fisa" onclick="aratapanel('fisa')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Pacienti</span>
    </button>
    <button class="bottom-nav-btn" data-panel="echipa" onclick="aratapanel('echipa')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
      <span>Echipa</span>
    </button>
    <button class="bottom-nav-btn" data-panel="statistici" onclick="aratapanel('statistici')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Statistici</span>
    </button>
  </nav>
</div>
<div id="modal-container"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
