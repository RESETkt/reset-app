<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Reset - dashboard kineto</title>
<link rel="icon" href="favicon-v2.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login" class="card" style="max-width:340px;margin:80px auto;">
  <div style="text-align:center;margin-bottom:16px">
    <img src="logo-icon.png" alt="Reset" style="height:56px">
  </div>
  <h2 style="text-align:center">Autentificare</h2>
  <label>Email</label>
  <input id="login-email" type="email" style="width:100%;margin-bottom:10px">
  <label>Parola</label>
  <input id="login-parola" type="password" style="width:100%;margin-bottom:14px">
  <button class="btn" style="width:100%" onclick="login()">Intra in cont</button>
  <div id="login-eroare" style="color:#b23b3b;font-size:12px;margin-top:8px"></div>
</div>

<div id="app" class="app" style="display:none">
  <div class="sidebar">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px">
        <img src="logo-icon.png" alt="Reset" style="height:32px">
        <span style="font-size:18px;font-weight:700;color:#ffffff;letter-spacing:0.5px">RESET</span>
      </div>
      <svg class="logout-btn" onclick="delogare()" title="Delogare" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">
      <button class="btn top-nav-btn activ" onclick="aratapanel('calendar')">Programari</button>
      <button class="btn top-nav-btn" onclick="aratapanel('fisa')">Fisa pacient</button>
      <button class="btn top-nav-btn" onclick="aratapanel('echipa')">Echipa</button>
      <button class="btn top-nav-btn" onclick="aratapanel('statistici')">Statistici</button>
    </div>
    <button class="btn" style="width:100%;margin-bottom:12px" onclick="aratatFormularPacientNou()">+ Pacient nou</button>
  </div>
  <div class="main">
    <div id="panel-calendar"></div>
    <div id="panel-fisa" style="display:none"></div>
    <div id="panel-echipa" style="display:none"></div>
    <div id="panel-statistici" style="display:none"></div>
  </div>
</div>
<div id="modal-container"></div>

<script src="app.js"></script>
</body>
</html>
